<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/app.css">
  <title>Education workspace | APSHULE</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">A</span>APSHULE Education</a>
      <div class="button-row"><span id="role-badge" class="badge">Loading workspace</span><button id="logout" class="button secondary" type="button">Sign out</button></div>
    </header>
    <main>
        <div class="section-title">
         <div><p class="eyebrow">School workspace</p><h1 id="title">Loading your workspace…</h1><p id="scope" class="muted"></p></div>
         <div class="button-row"><a class="button secondary" href="/profile.html">Profile</a><button id="refresh" class="button secondary" type="button">Refresh</button></div>
      </div>
      <section class="card panel">
        <h2>Access for this role</h2>
        <p class="muted">Data and actions shown here are limited by your assigned role and school scope.</p>
        <div id="capabilities" class="capabilities"></div>
      </section>
      <section id="actions" class="grid"></section>
      <section id="records"></section>
      <p id="status" class="notice" role="status" aria-live="polite"></p>
    </main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    let workspace = null;
    let activeUser = null;
    const cap = (name) => (workspace?.capabilities || []).some((value) => value === name || value === "*");
    const showStatus = (text, kind = "") => { $("status").textContent = text; $("status").className = `notice ${kind}`; };
    async function request(path, options = {}) {
      const response = await fetch(path, { credentials: "same-origin", ...options, headers: { "content-type": "application/json", ...(options.headers || {}) } });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.ok === false) throw new Error(data.error || `Request failed (${response.status})`);
      return data;
    }
    function renderRecords(title, items) {
      if (!Array.isArray(items)) return;
      const section = document.createElement("section");
      section.className = "card panel";
      const heading = document.createElement("div");
      heading.className = "section-title";
      const text = document.createElement("div");
      const h2 = document.createElement("h2"); h2.textContent = title;
      const note = document.createElement("p"); note.className = "muted"; note.textContent = `${items.length} record${items.length === 1 ? "" : "s"}`;
      text.append(h2, note); heading.append(text); section.append(heading);
      const list = document.createElement("div"); list.className = "data-list";
      if (!items.length) {
        const empty = document.createElement("p"); empty.className = "muted"; empty.textContent = "No records are available yet."; list.append(empty);
      }
      for (const item of items.slice(0, 100)) {
        const row = document.createElement("article"); row.className = "data-item";
        const strong = document.createElement("strong");
        strong.textContent = item.name || item.fullName || item.title || item.id || "Record";
        const pre = document.createElement("pre"); pre.textContent = JSON.stringify(item, null, 2);
        row.append(strong, pre); list.append(row);
      }
      section.append(list); $("records").append(section);
    }
    function addForm(title, fields, endpoint, mapValues, submitLabel = "Save") {
      const card = document.createElement("section"); card.className = "card panel";
      const heading = document.createElement("h2"); heading.textContent = title; card.append(heading);
      const form = document.createElement("form"); form.className = "form-grid";
      for (const field of fields) {
        const wrap = document.createElement("div");
        const fieldId = `${title.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${field.name}`;
        const label = document.createElement("label"); label.textContent = field.label; label.htmlFor = fieldId;
        let input;
        if (field.options) {
          input = document.createElement("select");
          for (const option of field.options) {
            const item = document.createElement("option");
            item.value = option.value; item.textContent = option.label; input.append(item);
          }
        } else if (field.multiline) {
          input = document.createElement("textarea");
          input.rows = field.rows || 3;
        } else {
          input = document.createElement("input");
          input.type = field.type || "text";
          if (field.min != null) input.min = String(field.min);
          if (field.max != null) input.max = String(field.max);
          if (field.step != null) input.step = String(field.step);
        }
        input.id = fieldId; input.name = field.name; input.required = field.required !== false;
        if (field.maxLength) input.maxLength = field.maxLength;
        if (field.placeholder) input.placeholder = field.placeholder;
        if (field.value != null) input.value = field.value;
        wrap.append(label, input); form.append(wrap);
      }
      const button = document.createElement("button"); button.className = "button"; button.type = "submit"; button.textContent = submitLabel; form.append(button);
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(form).entries());
        try {
          const mapped = mapValues ? mapValues(values) : Object.fromEntries(Object.entries(values).map(([key, value]) => {
            const field = fields.find((item) => item.name === key);
            return [key, field?.type === "number" && value !== "" ? Number(value) : value];
          }));
          await request(endpoint, { method: "POST", body: JSON.stringify(mapped) });
          form.reset(); showStatus(`${title} saved.`, "success"); await loadWorkspace();
        } catch (error) { showStatus(error.message, "error"); }
      });
      card.append(form); $("actions").append(card);
    }
    function renderActions() {
      $("actions").replaceChildren();
      if (cap("students.manage") || cap("students.secondary.manage")) {
        addForm("Add learner", [
          { name: "name", label: "Learner name", maxLength: 160 }, { name: "studentNumber", label: "Student number", maxLength: 80 },
          { name: "className", label: "Class", required: false, maxLength: 100 },
        ], "/api/school/learners", (v) => ({ name: v.name, studentNumber: v.studentNumber, className: v.className }));
      }
      if (cap("classes.manage") || String(workspace?.role).toLowerCase() === "secretary") {
        addForm("Add class", [
          { name: "name", label: "Class name", maxLength: 100 }, { name: "level", label: "Level", required: false, maxLength: 80 },
          { name: "academicYear", label: "Academic year", required: false, maxLength: 40 },
        ], "/api/school/classes");
      }
      if (cap("subjects.manage") || String(workspace?.role).toLowerCase() === "secretary") {
        addForm("Add subject", [
          { name: "name", label: "Subject", maxLength: 120 }, { name: "code", label: "Subject code", required: false, maxLength: 40 },
          { name: "className", label: "Class", required: false, maxLength: 100 },
        ], "/api/school/subjects");
      }
      if (cap("admissions.manage")) {
        addForm("Record an admission", [
          { name: "fullName", label: "Learner name", maxLength: 160 }, { name: "phone", label: "Guardian phone", type: "tel", maxLength: 80 },
          { name: "className", label: "Class applied for", maxLength: 100 }, { name: "previousSchool", label: "Previous school", required: false, maxLength: 160 },
        ], "/api/school/admissions");
      }
      if (cap("attendance.manage")) {
        addForm("Record attendance", [
          { name: "learnerId", label: "Learner ID", maxLength: 160 }, { name: "className", label: "Class", maxLength: 100 },
          { name: "date", label: "Date", type: "date" },
          { name: "status", label: "Status", options: [{ value: "present", label: "Present" }, { value: "absent", label: "Absent" }, { value: "late", label: "Late" }, { value: "excused", label: "Excused" }] },
        ], "/api/school/attendance");
      }
      if (cap("marks.manage")) {
        addForm("Record a mark", [
          { name: "learnerId", label: "Learner ID", maxLength: 160 }, { name: "subject", label: "Subject", maxLength: 120 },
          { name: "score", label: "Score (%)", type: "number", min: 0, max: 100, step: "0.01" }, { name: "term", label: "Term", required: false, maxLength: 80 },
        ], "/api/school/academic/marks", (v) => ({ learnerId: v.learnerId, subject: v.subject, score: Number(v.score), term: v.term }));
      }
      if (cap("grading.manage")) {
        addForm("Set a grading band", [
          { name: "gradeName", label: "Grade label", maxLength: 40 }, { name: "minimumScore", label: "Minimum score", type: "number", min: 0, max: 100, step: "0.01" },
          { name: "maximumScore", label: "Maximum score", type: "number", min: 0, max: 100, step: "0.01" }, { name: "remarks", label: "Remarks", required: false, maxLength: 160 },
        ], "/api/school/academic/grading", (v) => ({ gradeName: v.gradeName, minimumScore: Number(v.minimumScore), maximumScore: Number(v.maximumScore), remarks: v.remarks }));
      }
      if (cap("teacher_assignments.manage")) {
        addForm("Assign a teacher", [
          { name: "teacherUid", label: "Teacher account UID", maxLength: 160 }, { name: "teacherName", label: "Teacher name", maxLength: 160 },
          { name: "className", label: "Class", maxLength: 100 }, { name: "subject", label: "Subject", maxLength: 120 },
        ], "/api/school/teachers/assignments");
      }
      if (cap("id_cards.manage")) {
        addForm("Prepare learner ID record", [
          { name: "learnerId", label: "Learner ID", maxLength: 160 }, { name: "fullName", label: "Learner name", maxLength: 160 },
          { name: "studentNumber", label: "Student number", maxLength: 80 }, { name: "className", label: "Class", required: false, maxLength: 100 },
        ], "/api/school/id-cards");
      }
      if (cap("communications.manage")) {
        addForm("Create a school communication", [
          { name: "title", label: "Title", maxLength: 160 }, { name: "audience", label: "Audience", maxLength: 100 },
          { name: "message", label: "Message", multiline: true, maxLength: 2000 },
        ], "/api/school/communications");
      }
      if (cap("fees.manage")) {
        addForm("Add a fee record", [
          { name: "learnerId", label: "Learner ID", maxLength: 160 }, { name: "description", label: "Fee description", maxLength: 160 },
          { name: "amount", label: "Amount (UGX)", type: "number", min: 1, step: 1 }, { name: "dueDate", label: "Due date", type: "date" },
        ], "/api/school/bursar/fees", (v) => ({ learnerId: v.learnerId, description: v.description, amount: Number(v.amount), dueDate: v.dueDate }));
      }
      if (cap("payments.manage")) {
        addForm("Record a pending payment", [
          { name: "amount", label: "Amount (UGX)", type: "number", min: 1, step: 1 }, { name: "idempotencyKey", label: "Receipt or unique reference", maxLength: 200 },
        ], "/api/school/bursar/payments", (v) => ({ amount: Number(v.amount), idempotencyKey: v.idempotencyKey }));
      }
      if (cap("statements.manage")) {
        addForm("Create a bursar statement", [
          { name: "learnerId", label: "Learner ID", maxLength: 160 }, { name: "period", label: "Statement period", maxLength: 80 },
          { name: "openingBalance", label: "Opening balance (UGX)", type: "number", min: 0, step: 1 },
          { name: "balance", label: "Closing balance (UGX)", type: "number", min: 0, step: 1 },
        ], "/api/school/bursar/statements", (v) => ({ learnerId: v.learnerId, period: v.period, openingBalance: Number(v.openingBalance), balance: Number(v.balance) }));
      }
      if (cap("reconciliation.manage")) {
        addForm("Add reconciliation note", [
          { name: "title", label: "Title", maxLength: 160 }, { name: "reference", label: "Statement or receipt reference", maxLength: 160 },
          { name: "notes", label: "Notes", multiline: true, required: false, maxLength: 1000 },
        ], "/api/school/bursar/reconciliation");
      }
    }
    async function loadWorkspace() {
      showStatus("Loading records…");
      try {
        const [session, data] = await Promise.all([
          request("/api/auth/session", { method: "GET", headers: {} }),
          request("/api/school/education-workspace", { method: "GET", headers: {} }),
        ]);
        activeUser = session.user; workspace = data;
        const labels = { secretary: "Secretary", headteacher: "Head Teacher", bursar: "Bursar", superadmin: "Super Admin" };
        const label = labels[String(data.role).toLowerCase()] || String(data.role || "Education");
        $("role-badge").textContent = label;
        $("title").textContent = `${label} workspace`;
        $("scope").textContent = [data.schoolId, data.institutionId].filter(Boolean).join(" · ") || "All authorized schools";
        $("capabilities").replaceChildren(...(data.capabilities || []).map((value) => { const tag = document.createElement("span"); tag.textContent = value; return tag; }));
        renderActions();
        $("records").replaceChildren();
        const hiddenKeys = new Set(["ok", "role", "workspace", "schoolId", "institutionId", "capabilities"]);
        for (const [key, value] of Object.entries(data)) {
          if (hiddenKeys.has(key)) continue;
          if (Array.isArray(value)) renderRecords(key.replace(/[A-Z]/g, (letter) => ` ${letter.toLowerCase()}`).replace(/^./, (letter) => letter.toUpperCase()), value);
          else if (value && typeof value === "object") {
            for (const [childKey, childValue] of Object.entries(value)) {
              if (Array.isArray(childValue)) renderRecords(childKey, childValue);
              else if (childValue && typeof childValue === "object") renderRecords(childKey, [childValue]);
            }
          }
        }
        showStatus("Workspace is up to date.", "success");
      } catch (error) {
        if (error.message.includes("Authentication")) { location.replace("/"); return; }
        showStatus(error.message, "error");
      }
    }
    $("refresh").addEventListener("click", loadWorkspace);
    $("logout").addEventListener("click", async () => { try { await request("/api/auth/logout", { method: "POST", body: "{}" }); } finally { location.assign("/"); } });
    loadWorkspace();
  </script>
</body>
</html>
