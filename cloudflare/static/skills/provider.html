<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore an active vocational training provider on APSHULE Skills.">
  <meta name="theme-color" content="#35172f">
  <link rel="stylesheet" href="./styles.css">
  <script src="./api-config.js"></script>
  <title>Provider profile | APSHULE Skills</title>
</head>
<body>
  <div class="skills-app">
    <div class="skills-topline"><div class="skills-shell topline-inner"><span class="skills-mono">Provider profile / APSHULE Skills</span><span>Practical training across Uganda</span></div></div>
    <header class="skills-shell skills-nav">
      <a class="skills-brand" href="./"><span class="brand-mark">A</span><span>APSHULE<small>Skills / Uganda</small></span></a>
      <a class="storefront-back" href="./">← Back to course desk</a>
    </header>
    <main class="skills-shell provider-page">
      <section id="providerHero" class="provider-hero" aria-live="polite">
        <p class="skills-eyebrow">Provider profile</p>
        <h1>Loading institution profile…</h1>
      </section>
      <div id="providerLayout" class="provider-layout" hidden></div>
      <footer class="provider-footer"><strong>Powered by APSHULE</strong><span>Clear courses. Real institutions.</span></footer>
    </main>
  </div>
  <script>
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;",
    }[char]));
    const safeImageUrl = (value) => {
      try {
        const url = new URL(String(value || ""), location.origin);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    };
    const apiBase = window.APSHULE_API_BASE || "";
    const params = new URLSearchParams(location.search);
    const providerId = params.get("id")?.trim() || "";
    const referral = params.get("ref")?.trim() || "";
    const money = (value) => Number(value || 0) ? `UGX ${Number(value).toLocaleString()}` : "Fee on inquiry";

    async function loadProvider() {
      let provider;
      if (providerId) {
        const response = await fetch(`${apiBase}/api/skills/providers/${encodeURIComponent(providerId)}`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || "Provider profile unavailable");
        provider = data.provider;
      } else if (referral) {
        const response = await fetch(`${apiBase}/api/skills/providers`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || "Provider directory unavailable");
        provider = (data.providers || []).find((item) => item.referralCode === referral);
      } else {
        throw new Error("This provider profile link is incomplete.");
      }
      if (!provider) throw new Error("This institution is not available. It may be awaiting approval or the profile link may be incomplete.");
      return provider;
    }

    function renderProvider(provider) {
      const courses = Array.isArray(provider.courses) ? provider.courses.filter((course) => course.title) : [];
      const logoUrl = safeImageUrl(provider.logoUrl);
      const logo = logoUrl
        ? `<img class="provider-identity-logo" src="${esc(logoUrl)}" alt="${esc(provider.name)} logo">`
        : `<div class="provider-identity-logo provider-logo-fallback" aria-hidden="true">${esc((provider.name || "P").slice(0, 1).toUpperCase())}</div>`;
      const grouped = courses.reduce((result, course) => {
        const category = course.category || "Courses";
        (result[category] ||= []).push(course);
        return result;
      }, {});
      const contactRows = [
        `<div><strong>Physical address</strong>${esc(provider.physicalAddress || "Available on request")}</div>`,
        provider.contactPhone ? `<div><strong>Phone</strong><a href="tel:${esc(provider.contactPhone)}">${esc(provider.contactPhone)}</a></div>` : "",
        provider.contactEmail ? `<div><strong>Email</strong><a href="mailto:${esc(provider.contactEmail)}">${esc(provider.contactEmail)}</a></div>` : "",
        `<div><strong>Provider reference</strong>${esc(provider.referralCode || "Assigned by APSHULE")}</div>`,
      ].filter(Boolean).join("");
      const courseGroups = Object.entries(grouped).map(([category, items]) => `
        <section class="course-group">
          <p class="skills-eyebrow">${esc(category)}</p>
          ${items.map((course) => `<article class="provider-course">
            <div>
              <h3>${esc(course.title)}</h3>
              <p>${esc(course.description || "Practical vocational training with this institution.")}</p>
              <div class="provider-course-pills">${course.duration ? `<span>${esc(course.duration)}</span>` : ""}${course.featured ? "<span>Featured</span>" : ""}</div>
            </div>
            <div class="provider-course-side"><strong>${esc(money(course.feeUgx))}</strong><span>Ask the provider about the next intake.</span></div>
          </article>`).join("")}
        </section>`).join("");

      document.title = `${provider.name} | APSHULE Skills`;
      document.getElementById("providerHero").innerHTML = `<div class="provider-identity">${logo}<div>
        <p class="skills-eyebrow">Active training provider</p>
        <h1>${esc(provider.name)}</h1>
        <p class="provider-intro">${esc(provider.whatTheyTeach || provider.description || "A practical vocational institution helping learners build skills for work.")}</p>
        <div class="provider-meta"><span>${esc(provider.physicalAddress || "Uganda")}</span><span>${courses.length} published course${courses.length === 1 ? "" : "s"}</span></div>
      </div></div>`;
      const layout = document.getElementById("providerLayout");
      layout.innerHTML = `<section class="provider-courses-panel">
        <h2>Courses at ${esc(provider.name)}</h2>
        ${courseGroups || '<div class="empty-state">This institution has not published courses yet. Contact the provider for its next intake.</div>'}
      </section>
      <aside class="provider-sidebar">
        <section class="provider-details"><h2>Institution details</h2><div class="contact-list">${contactRows}</div></section>
        <section class="provider-aside-note"><strong>Ready to make a start?</strong><p>Contact the provider to ask about course availability, fees, and the next intake.</p></section>
      </aside>`;
      layout.hidden = false;
    }

    loadProvider()
      .then(renderProvider)
      .catch((error) => {
        const hero = document.getElementById("providerHero");
        hero.innerHTML = `<div class="error-state"><p class="skills-eyebrow">Profile unavailable</p><h1>We couldn't load this institution.</h1><p>${esc(error.message)}</p><a class="skills-button primary" href="./">Return to the course desk</a></div>`;
      });
  </script>
</body>
</html>
