<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/app.css"><title>Profile | APSHULE</title></head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="/"><span class="brand-mark">A</span>APSHULE</a><div class="button-row"><span id="role" class="badge">Loading account</span><button id="logout" class="button secondary" type="button">Sign out</button></div></header>
    <main>
      <div class="section-title"><div><p class="eyebrow">Account settings</p><h1>Your profile</h1><p id="identity" class="muted">Manage your profile photo. It is private to your account.</p></div><a class="button secondary" href="/">Home</a></div>
      <section class="card panel">
        <h2>Profile photo</h2><p class="muted">Use a JPEG, PNG, or WebP image up to 5 MB. Replacing a photo keeps the previous upload safely stored.</p>
        <div class="profile-photo-layout"><img id="photo" class="profile-photo" src="https://appshule.com/api/profile/photo" alt="Your profile photo"><form id="form" class="form-grid"><label for="file">Choose an image</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required><button class="button" type="submit">Upload photo</button></form></div>
        <p id="status" class="notice" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    async function request(path, options = {}) { const res = await fetch(new URL(path, "https://appshule.com"), { credentials: "same-origin", ...options }); const data = await res.json().catch(() => ({})); if (!res.ok || data.ok === false) throw new Error(data.error || `Request failed (${res.status})`); return data; }
    async function init() { try { const session = await request("/api/auth/session"); $("role").textContent = session.user.role; $("identity").textContent = `${session.user.displayName || session.user.email} · Your profile photo is private to your account.`; } catch (error) { $("status").textContent = error.message; setTimeout(() => location.replace("/"), 700); } }
    $("form").addEventListener("submit", async (event) => { event.preventDefault(); const file = $("file").files[0]; if (!file) return; $("status").textContent = "Uploading…"; try { await request("/api/profile/photo", { method: "POST", headers: { "content-type": file.type }, body: file }); $("photo").src = new URL(`/api/profile/photo?refresh=${Date.now()}`, "https://appshule.com").href; $("status").textContent = "Profile photo updated."; $("status").className = "notice success"; $("form").reset(); } catch (error) { $("status").textContent = error.message; $("status").className = "notice error"; } });
    $("logout").addEventListener("click", async () => { try { await request("/api/auth/logout", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }); } finally { location.assign("/"); } }); init();
  </script>
</body>
</html>
