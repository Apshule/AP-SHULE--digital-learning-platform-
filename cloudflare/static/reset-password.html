<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/app.css">
  <title>Reset password | APSHULE</title>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="/"><span class="brand-mark">A</span>APSHULE</a></header>
    <main class="hero">
      <section class="hero-copy">
        <p class="eyebrow">Account recovery</p>
        <h1 id="step-title">Reset your password.</h1>
        <p id="step-description">We’ll email you a 6-digit code. It expires after 10 minutes and can only be used once.</p>
      </section>
      <section class="card auth-card">
        <form id="email-form" class="form-grid">
          <div>
            <label for="email">Account email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <button id="send-code" class="button" type="submit">Email me a code</button>
        </form>

        <form id="code-form" class="form-grid hidden" hidden>
          <div>
            <label for="code">6-digit code</label>
            <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
              pattern="[0-9]{6}" maxlength="6" aria-describedby="code-help" required>
            <p id="code-help" class="notice">Enter the code from your email. It expires in 10 minutes.</p>
          </div>
          <button id="verify-code" class="button" type="submit">Verify code</button>
          <button id="resend-code" class="button secondary" type="button">Resend code</button>
        </form>

        <form id="password-form" class="form-grid hidden" hidden>
          <div>
            <label for="password">New password</label>
            <input id="password" type="password" minlength="12" autocomplete="new-password" required>
          </div>
          <div>
            <label for="confirm">Confirm new password</label>
            <input id="confirm" type="password" minlength="12" autocomplete="new-password" required>
          </div>
          <button id="save-password" class="button" type="submit">Update password</button>
        </form>
        <p id="message" class="notice" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script>
    const message = document.getElementById("message");
    const emailForm = document.getElementById("email-form");
    const codeForm = document.getElementById("code-form");
    const passwordForm = document.getElementById("password-form");
    const emailInput = document.getElementById("email");
    const codeInput = document.getElementById("code");
    const sendButton = document.getElementById("send-code");
    const resendButton = document.getElementById("resend-code");
    let email = "";
    let resetTicket = "";
    let resendInterval = 0;

    function setMessage(text, type = "") {
      message.textContent = text;
      message.className = `notice ${type}`;
    }

    async function request(path, body) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify(body),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.ok === false) throw new Error(result.error || `Request failed (${response.status})`);
      return result;
    }

    function startResendCooldown(seconds = 60) {
      window.clearInterval(resendInterval);
      let remaining = seconds;
      resendButton.disabled = true;
      const update = () => {
        resendButton.textContent = remaining > 0 ? `Resend code in ${remaining}s` : "Resend code";
        if (remaining <= 0) {
          resendButton.disabled = false;
          window.clearInterval(resendInterval);
          return;
        }
        remaining -= 1;
      };
      update();
      resendInterval = window.setInterval(update, 1000);
    }

    async function sendCode() {
      const requestButton = emailForm.hidden ? resendButton : sendButton;
      setMessage("Requesting a code…");
      requestButton.disabled = true;
      try {
        const result = await request("/api/auth/request-password-reset", { email });
        emailForm.hidden = true;
        codeForm.hidden = false;
        document.getElementById("step-title").textContent = "Check your email.";
        document.getElementById("step-description").textContent = "Enter the 6-digit code to continue. If the email belongs to an active account, a code will arrive shortly.";
        setMessage(result.message || "If the email belongs to an active account, a code will be sent. If you just requested one, wait 60 seconds.", "success");
        startResendCooldown();
        codeInput.focus();
      } catch (error) {
        setMessage(error.message, "error");
        if (emailForm.hidden) startResendCooldown();
      } finally {
        if (requestButton === sendButton) sendButton.disabled = false;
      }
    }

    emailForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      email = emailInput.value.trim();
      await sendCode();
    });

    codeInput.addEventListener("input", () => {
      codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
    });

    codeForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const code = codeInput.value.trim();
      if (!/^\d{6}$/.test(code)) {
        setMessage("Enter the 6-digit code from your email.", "error");
        return;
      }
      setMessage("Verifying code…");
      document.getElementById("verify-code").disabled = true;
      try {
        const result = await request("/api/auth/verify-password-reset-code", { email, code });
        resetTicket = result.resetTicket;
        codeForm.hidden = true;
        passwordForm.hidden = false;
        document.getElementById("step-title").textContent = "Choose a new password.";
        document.getElementById("step-description").textContent = "Use at least 12 characters. Your reset code has now been used.";
        setMessage("Code verified. Set your new password.", "success");
        document.getElementById("password").focus();
      } catch (error) {
        setMessage(error.message, "error");
      } finally {
        document.getElementById("verify-code").disabled = false;
      }
    });

    resendButton.addEventListener("click", sendCode);

    passwordForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) {
        setMessage("Passwords do not match.", "error");
        return;
      }
      if (password.length < 12) {
        setMessage("Use at least 12 characters.", "error");
        return;
      }
      setMessage("Updating password…");
      document.getElementById("save-password").disabled = true;
      try {
        await request("/api/auth/complete-password-reset", { ticket: resetTicket, password });
        resetTicket = "";
        setMessage("Password updated. Returning to sign in…", "success");
        setTimeout(() => location.assign("/"), 1200);
      } catch (error) {
        setMessage(error.message, "error");
      } finally {
        document.getElementById("save-password").disabled = false;
      }
    });
  </script>
</body>
</html>
