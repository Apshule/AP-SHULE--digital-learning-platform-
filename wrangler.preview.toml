name = "apshule-preview-local"
main = "cloudflare/worker.ts"
compatibility_date = "2026-09-23"
workers_dev = false

[vars]
ENVIRONMENT = "development"
D1_DATABASE_NAME = "apshule-preview-local"
PUBLIC_SITE_URL = "http://localhost:8080"

[[d1_databases]]
binding = "DB"
database_name = "apshule-preview-local"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "cloudflare/migrations"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "apshule-preview-videos"

[[r2_buckets]]
binding = "FILES"
bucket_name = "apshule-preview-files"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000-0000-4000-8000-000000000002"

[[kv_namespaces]]
binding = "SESSIONS"
id = "00000000-0000-4000-8000-000000000003"

[assets]
directory = "cloudflare/assets"
binding = "STATIC"
not_found_handling = "none"