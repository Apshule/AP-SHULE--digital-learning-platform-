<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Apply for vocational admission | APSHULE Skills</title><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="./firebase-config.js"></script><script src="./api-config.js"></script>
<style>:root{--ink:#211d25;--muted:#766c69;--plum:#54284d;--dark:#35172f;--orange:#e86f42;--paper:#f4ede2;--white:#fffaf2;--line:#dcd0c1;--red:#9e3f39;--green:#267249}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}.shell{width:min(780px,calc(100% - 34px));margin:auto}header{background:var(--dark);color:#fff;padding:20px 0}header a{color:#fff;text-decoration:none}.brand{font-weight:900}.brand small{display:block;color:#e8c9b7;font-size:11px}.hero{padding:40px 0 20px}.eyebrow{color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(38px,7vw,65px);line-height:.95;letter-spacing:-.07em;margin:12px 0}.hero p{color:var(--muted)}.card{background:var(--white);border:1px solid var(--line);padding:22px;margin:16px 0}.form{display:grid;gap:13px}.field{display:grid;gap:5px}.field label{font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.05em}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);background:#fff;font:inherit}.field textarea{min-height:90px}.button{border:0;background:var(--plum);color:#fff;padding:11px 15px;font-weight:800;cursor:pointer}.button:disabled{opacity:.5}.status{font-size:13px;color:var(--muted);margin-top:10px}.status.error{color:var(--red)}.status.success{color:var(--green)}.hidden{display:none!important}</style></head>
<body><header><div class="shell"><a href="./">← APSHULE Skills</a><div class="brand">Vocational admission<small>Clear steps. Practical routes.</small></div></div></header>
<main class="shell"><section class="hero"><div class="eyebrow">Admission application</div><h1 id="title">Apply to a course.</h1><p id="course"></p></section><section id="authCard" class="card"><h2>Sign in to continue</h2><form id="authForm" class="form"><div class="field"><label for="email">Email</label><input id="email" type="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" required></div><button class="button" type="submit">Sign in</button></form><div id="authStatus" class="status"></div></section>
<section id="applicationCard" class="card hidden"><h2>First step: UGX 20,000 admission fee</h2><p class="status">Your application is submitted only after the payment callback confirms this fee. Agreement splits are never shown here.</p><form id="paymentForm" class="form"><div class="field"><label for="phone">Mobile money phone</label><input id="phone" required placeholder="07XXXXXXXX"></div><div class="field"><label for="paymentMethod">Network</label><select id="paymentMethod"><option>MTN</option><option>Airtel</option></select></div><button class="button" type="submit">Start admission payment</button></form><div id="paymentStatus" class="status"></div><form id="applicationForm" class="form hidden"><div class="field"><label for="fullName">Full name</label><input id="fullName" required></div><div class="field"><label for="appEmail">Email</label><input id="appEmail" type="email" required></div><div class="field"><label for="educationLevel">Highest education level</label><input id="educationLevel" required></div><div class="field"><label for="previousExperience">Previous experience</label><textarea id="previousExperience"></textarea></div><button class="button" type="submit">Submit admission application</button></form><div id="applicationStatus" class="status"></div></section></main>
 <script>const $=id=>document.getElementById(id),apiBase=window.APSHULE_API_BASE||"",api=path=>`${apiBase}${path}`,auth=firebase.initializeApp(window.APSHULE_FIREBASE_CONFIG).auth(),params=new URLSearchParams(location.search),providerId=params.get("providerId")||"",referralCode=params.get("referralCode")||"",courseId=params.get("courseId")||"",state={paymentReference:""};$("course").textContent=`Course: ${courseId||"select a course from a provider profile"}`;const set=(id,message,type="")=>{$(id).textContent=message;$(id).className=`status ${type}`};async function request(path,options={}){const user=auth.currentUser;if(!user)throw Error("Sign in first.");const token=await user.getIdToken();const r=await fetch(api(path),{...options,headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`}}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||`Request failed (${r.status})`);return d}auth.onAuthStateChanged(user=>{if(user){$("authCard").classList.add("hidden");$("applicationCard").classList.remove("hidden");$("appEmail").value=user.email||""}});$("authForm").onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);set("authStatus","Signed in.","success")}catch(error){set("authStatus",error.message,"error")}};$("paymentForm").onsubmit=async e=>{e.preventDefault();try{const d=await request("/api/pay",{method:"POST",body:JSON.stringify({providerId,amountUgx:20000,phone:$("phone").value,paymentMethod:$("paymentMethod").value})});state.paymentReference=d.paymentReference;set("paymentStatus",d.message||"Approve the payment prompt. Waiting for confirmation…");$("applicationForm").classList.remove("hidden")}catch(error){set("paymentStatus",error.message,"error")}};$("applicationForm").onsubmit=async e=>{e.preventDefault();try{await request("/api/skills/admission",{method:"POST",body:JSON.stringify({providerId,referralCode,courseId,fullName:$("fullName").value,phone:$("phone").value,email:$("appEmail").value,educationLevel:$("educationLevel").value,previousExperience:$("previousExperience").value,paymentReference:state.paymentReference})});set("applicationStatus","Application submitted successfully.","success")}catch(error){set("applicationStatus",error.message,"error")}};</script>
</body></html>
