<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore an active vocational training provider on APSHULE Skills.">
  <title>Provider profile | APSHULE Skills</title>
  <script src="./api-config.js"></script>
  <style>
    :root{--ink:#211d25;--muted:#766c69;--plum:#54284d;--dark:#35172f;--orange:#e86f42;--paper:#f4ede2;--white:#fffaf2;--line:#dcd0c1}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
    .shell{width:min(980px,calc(100% - 34px));margin:auto}
    header{background:var(--dark);color:#fff;padding:18px 0}
    header .shell{display:flex;justify-content:space-between;gap:18px;align-items:center}
    .brand{font-weight:900}
    .brand small{display:block;color:#e8c9b7;font-size:11px;font-weight:500}
    .back{color:#fff;border:1px solid #ffffff55;padding:8px 12px;text-decoration:none;font-size:12px}
    main{padding:42px 0 70px}
    .hero{max-width:760px;margin-bottom:28px}
    .eyebrow{color:var(--orange);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:900}
    .hero h1{font-size:clamp(40px,7vw,72px);line-height:.94;letter-spacing:-.07em;margin:12px 0}
    .hero p{color:var(--muted);font-size:16px}
    .contact{display:flex;flex-wrap:wrap;gap:10px 20px;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}
    .contact a{color:var(--plum);font-weight:800}
    .section-title{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:34px 0 18px}
    .section-title h2{margin:7px 0;font-size:34px;line-height:1;letter-spacing:-.05em}
    .status{color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .card{background:var(--white);border:1px solid var(--line);padding:20px}
    .card h3{color:var(--plum);margin:0 0 8px;font-size:22px}
    .card p{color:var(--muted);font-size:13px}
    .meta{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;color:var(--muted);font-size:12px}
    .next-intake{margin:10px 0 0;font-size:12px;color:var(--muted)}
    .empty{grid-column:1/-1;border:1px dashed #c5b5a4;padding:25px;color:var(--muted)}
    .error{color:#9e3f39}
    .logo{max-width:160px;max-height:110px;object-fit:contain;background:var(--white);border:1px solid var(--line);padding:10px}
    [hidden]{display:none!important}
    @media(max-width:650px){.grid{grid-template-columns:1fr}header .shell{align-items:flex-start}.back{white-space:nowrap}.section-title{display:block}.section-title .status{display:block;margin-top:10px}}
  </style>
</head>
<body>
  <header><div class="shell"><div class="brand">APSHULE SKILLS<small>Provider profile / Uganda</small></div><a class="back" href="./">← Skills directory</a></div></header>
  <main class="shell">
    <section class="hero" aria-live="polite">
      <div class="eyebrow">Active training provider</div>
      <h1 id="name">Loading profile…</h1>
      <p id="description"></p>
      <div id="contact" class="contact"></div>
    </section>
    <section>
      <div class="section-title"><div><div class="eyebrow">Published courses</div><h2>Choose your route.</h2></div><span id="courseStatus" class="status">Loading courses…</span></div>
      <div id="courses" class="grid" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const apiBase = window.APSHULE_API_BASE || "";
    const params = new URLSearchParams(location.search);
    const providerId = params.get("id")?.trim() || "";
    const referral = params.get("ref")?.trim() || "";
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;",
    }[char]));
    const money = (value) => Number(value || 0) ? `UGX ${Number(value).toLocaleString()}` : "Fee on inquiry";

    async function getProvider() {
      if (providerId) {
        const response = await fetch(`${apiBase}/api/skills/providers/${encodeURIComponent(providerId)}`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || "Provider profile unavailable");
        return data.provider;
      }
      if (referral) {
        const response = await fetch(`${apiBase}/api/skills/providers`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || "Provider directory unavailable");
        return (data.providers || []).find((provider) => provider.referralCode === referral);
      }
      throw new Error("This provider profile link is incomplete.");
    }

    getProvider().then((provider) => {
      if (!provider) throw new Error("This institution is not available. It may be awaiting approval or the profile link may be incomplete.");
      document.title = `${provider.name} | APSHULE Skills`;
      $("name").textContent = provider.name;
      $("description").textContent = provider.whatTheyTeach || provider.description || "Practical vocational training from an active Ugandan provider.";
      const contact = [];
      if (provider.physicalAddress) contact.push(`<span>${esc(provider.physicalAddress)}</span>`);
      if (provider.contactPhone) contact.push(`<a href="tel:${esc(provider.contactPhone)}">${esc(provider.contactPhone)}</a>`);
      if (provider.contactEmail) contact.push(`<a href="mailto:${esc(provider.contactEmail)}">${esc(provider.contactEmail)}</a>`);
      $("contact").innerHTML = contact.join("");
      const courses = Array.isArray(provider.courses) ? provider.courses.filter((course) => course.title) : [];
      $("courseStatus").textContent = `${courses.length} published course${courses.length === 1 ? "" : "s"}`;
      $("courses").innerHTML = courses.map((course) => `<article class="card">
        <div class="eyebrow">${esc(course.category || "Vocational training")}</div>
        <h3>${esc(course.title)}</h3>
        <p>${esc(course.description || "Practical training from this provider.")}</p>
        <div class="meta">${esc(course.duration || "Flexible")} · ${esc(money(course.feeUgx))}</div>
        <p class="next-intake">Ask the provider about the next intake.</p>
      </article>`).join("") || '<div class="empty">This provider has not published courses yet. Contact the institution to ask about its next intake.</div>';
    }).catch((error) => {
      $("name").textContent = "Profile unavailable";
      $("description").textContent = error.message;
      $("courseStatus").textContent = "Profile unavailable";
      $("courses").innerHTML = '<div class="empty error">Try returning to the provider directory.</div>';
    });
  </script>
</body>
</html>
