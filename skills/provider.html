<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training provider | APSHULE Skills</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    :root{--ink:#17112b;--muted:#6d6680;--purple:#4b2e9e;--cream:#fbf8f1;--line:#ebe5f4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(980px,calc(100% - 34px));margin:auto}header{background:#4b2e9e;color:#fff;padding:18px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:900}.brand small{display:block;font-size:11px;font-weight:500;opacity:.8}.back{border:1px solid #ffffff55;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}.hero{padding:48px 0 25px}.identity{display:flex;gap:22px;align-items:center}.logo{height:92px;width:92px;border-radius:24px;object-fit:cover;background:#eee6ff;display:grid;place-items:center;color:var(--purple);font-weight:900;font-size:34px;flex:0 0 auto}.eyebrow{color:var(--purple);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:900}.hero h1{font-size:clamp(32px,5vw,55px);line-height:1.05;letter-spacing:-.05em;margin:7px 0}.hero p{color:var(--muted);margin:5px 0}.pill{display:inline-flex;background:#f0eaff;color:var(--purple);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900;margin:5px 5px 0 0}.layout{display:grid;grid-template-columns:1fr 320px;gap:20px;padding-bottom:56px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px #301d6610}.card h2{margin:0 0 16px;font-size:22px}.course{border-top:1px solid var(--line);padding:17px 0;display:flex;justify-content:space-between;gap:18px}.course:first-child{border-top:0;padding-top:0}.course h3{margin:0 0 5px;font-size:18px}.course p{margin:0;color:var(--muted);font-size:13px}.course-side{text-align:right;min-width:120px}.fee{font-weight:900;color:var(--purple);display:block;margin-bottom:10px}.register{border:0;background:var(--purple);color:#fff;border-radius:10px;padding:10px 12px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.contact-list{display:grid;gap:12px;color:var(--muted);font-size:13px}.contact-list strong{display:block;color:var(--ink);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.empty{color:var(--muted);padding:18px;background:#faf8ff;border-radius:12px}.error{padding:28px;text-align:center;color:#8c2731;background:#fff0f1;border:1px solid #f1bec3;border-radius:16px}@media(max-width:760px){.layout{grid-template-columns:1fr}.identity{align-items:start}.logo{height:70px;width:70px;font-size:25px}.course{display:block}.course-side{text-align:left;margin-top:10px}}
  </style>
</head>
<body>
  <header><div class="shell nav"><a class="brand" href="./">APSHULE VOCATIONAL TRAINING CENTRE<small>Where Dreams Come true</small></a><a class="back" href="./">← Course directory</a></div></header>
  <main class="shell"><section id="providerHero" class="hero"></section><div id="providerLayout" class="layout"></div></main>
  <script>
    const firebaseConfig={apiKey:"AIzaSyBaO3Al6ubOcH3NxZBYmhjuOyihYc_q9kg",authDomain:"apshule-app.firebaseapp.com",projectId:"apshule-app",storageBucket:"apshule-app.firebasestorage.app",messagingSenderId:"610368652834",appId:"1:610368652834:web:1a30274d95c282a5a3ac7b"};
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    try{firebase.initializeApp(firebaseConfig)}catch(_){}
    const db=firebase.firestore(), ref=new URLSearchParams(location.search).get("ref")||"";
    const money=value=>Number(value||0)?`UGX ${Number(value).toLocaleString()}`:"Fee on inquiry";
    const logo=provider=>provider.logoUrl?`<img class="logo" src="${esc(provider.logoUrl)}" alt="${esc(provider.name)} logo">`:`<div class="logo">${esc((provider.name||"P").slice(0,1).toUpperCase())}</div>`;
    db.collection("providers").where("status","==","active").get().then(snapshot=>{
      const provider=snapshot.docs.map(doc=>({id:doc.id,...doc.data()})).find(row=>row.referralCode===ref);
      if(!provider){document.getElementById("providerHero").innerHTML='<div class="error">This provider profile is unavailable or no longer active.</div>';return}
      const courses=Array.isArray(provider.courses)?provider.courses:[];
      document.title=`${provider.name} | APSHULE Skills`;
      document.getElementById("providerHero").innerHTML=`<div class="identity">${logo(provider)}<div><div class="eyebrow">Approved training provider</div><h1>${esc(provider.name)}</h1><p>${esc(provider.physicalAddress||"Uganda")} ${provider.rating?` · ★ ${Number(provider.rating).toFixed(1)}`:""}</p></div></div>`;
      document.getElementById("providerLayout").innerHTML=`<section class="card"><h2>Courses at ${esc(provider.name)}</h2>${courses.map(course=>`<article class="course"><div><h3>${esc(course.title)}</h3><p>${esc(course.description||"Practical vocational training.")}</p><span class="pill">${esc(course.duration||"Flexible duration")}</span>${course.featured?'<span class="pill">Featured</span>':""}</div><div class="course-side"><span class="fee">${money(course.feeUgx)}</span><a class="register" href="./enroll.html?ref=${encodeURIComponent(provider.referralCode)}&provider=${encodeURIComponent(provider.id)}&course=${encodeURIComponent(course.id)}">Register for Course</a></div></article>`).join("")||'<div class="empty">This provider has not published courses yet.</div>'}</section><aside class="card"><h2>About the provider</h2><p>${esc(provider.description||"This approved provider offers practical vocational training through APSHULE.")}</p><div class="contact-list"><div><strong>Address</strong>${esc(provider.physicalAddress||"Available on request")}</div>${provider.contactPhone?`<div><strong>Phone</strong><a href="tel:${esc(provider.contactPhone)}">${esc(provider.contactPhone)}</a></div>`:""}${provider.contactEmail?`<div><strong>Email</strong><a href="mailto:${esc(provider.contactEmail)}">${esc(provider.contactEmail)}</a></div>`:""}<div><strong>Provider reference</strong>${esc(provider.referralCode)}</div></div></aside>`;
    }).catch(()=>document.getElementById("providerHero").innerHTML='<div class="error">We could not load this provider profile. Please try again shortly.</div>');
  </script>
</body>
</html>
