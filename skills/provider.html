<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Provider profile | APSHULE Skills</title><script src="./api-config.js"></script>
<style>:root{--ink:#211d25;--muted:#766c69;--plum:#54284d;--orange:#e86f42;--paper:#f4ede2;--white:#fffaf2;--line:#dcd0c1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}.shell{width:min(940px,calc(100% - 34px));margin:auto}header{background:var(--plum);color:#fff;padding:22px 0}header a{color:#fff;text-decoration:none}.brand{font-weight:900}.brand small{display:block;color:#e8c9b7;font-size:11px}.hero{padding:45px 0 32px}.eyebrow{color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(40px,7vw,72px);line-height:.94;letter-spacing:-.07em;margin:12px 0}.hero p{color:var(--muted);max-width:650px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:60px}.card{background:var(--white);border:1px solid var(--line);padding:20px}.card h2{color:var(--plum);margin:0 0 8px}.card p{color:var(--muted);font-size:13px}.meta{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;color:var(--muted);font-size:12px}.button{display:inline-block;background:var(--plum);color:#fff;padding:10px 13px;text-decoration:none;font-weight:800;font-size:12px}.empty{grid-column:1/-1;border:1px dashed #c5b5a4;padding:25px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><div class="shell"><a href="./">← APSHULE Skills</a><div class="brand" id="brand">Provider profile<small>Powered by APSHULE VOCATIONAL</small></div></div></header>
<main class="shell"><section class="hero"><div class="eyebrow">Active training provider</div><h1 id="name">Loading profile…</h1><p id="description"></p><p id="address"></p></section><section><div class="eyebrow">Published courses</div><div id="courses" class="grid"></div></section></main>
<script>const $=id=>document.getElementById(id),apiBase=window.APSHULE_API_BASE||"",api=path=>`${apiBase}${path}`,esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),params=new URLSearchParams(location.search),id=params.get("id");fetch(api(`/api/skills/providers/${encodeURIComponent(id||"")}`)).then(r=>r.json().then(d=>{if(!r.ok||!d.ok)throw Error(d.error||"Provider profile unavailable");return d.provider})).then(provider=>{$("name").textContent=provider.name;$("description").textContent=provider.whatTheyTeach||provider.description||"Practical vocational training from an active Ugandan provider.";$("address").textContent=provider.physicalAddress||"Uganda";$("courses").innerHTML=(provider.courses||[]).map(course=>`<article class="card"><h2>${esc(course.title)}</h2><p>${esc(course.description||"Practical training from this provider.")}</p><div class="meta">${esc(course.category||"Vocational training")} · ${esc(course.duration||"Flexible")} · UGX ${Number(course.feeUgx||0).toLocaleString()}</div><a class="button" href="./skills-enroll.html?providerId=${encodeURIComponent(provider.id)}&referralCode=${encodeURIComponent(provider.referralCode||"")}&courseId=${encodeURIComponent(course.id)}">Apply for this course →</a></article>`).join("")||'<div class="empty">This provider has not published courses yet.</div>'}).catch(error=>{$("name").textContent="Profile unavailable";$("description").textContent=error.message;$("courses").innerHTML='<div class="empty">Try returning to the provider directory.</div>'});</script>
</body></html>
