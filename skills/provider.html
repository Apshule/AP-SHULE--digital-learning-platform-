<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider profile | APSHULE Skills</title>
  <meta name="description" content="Explore an active vocational training provider on APSHULE Skills.">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./api-config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap');
    :root{--paper:#f4ede2;--paper-2:#ebe0d0;--ink:#211d25;--muted:#766c69;--plum:#54284d;--plum-dark:#35172f;--orange:#e86f42;--gold:#d6a950;--line:#dcd0c1;--white:#fffaf2}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "DM Sans",ui-sans-serif,system-ui,sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(1050px,calc(100% - 38px));margin:auto}.topline{background:var(--plum-dark);color:#f6e6cc;padding:9px 0;font:11px "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase}.nav{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0}.brand{display:flex;align-items:center;gap:10px;font:800 17px "Syne",sans-serif;letter-spacing:-.04em}.mark{width:34px;height:34px;background:var(--orange);color:var(--plum-dark);display:grid;place-items:center;transform:rotate(-7deg)}.back{color:var(--plum);font-size:12px;font-weight:800;border-bottom:1px solid var(--plum);padding-bottom:3px}.hero{padding:54px 0 38px;border-bottom:1px solid var(--line)}.identity{display:grid;grid-template-columns:112px 1fr;gap:24px;align-items:center}.logo{width:112px;height:112px;object-fit:cover;background:var(--plum);color:var(--white);display:grid;place-items:center;font:800 43px "Syne",sans-serif}.eyebrow{color:var(--orange);font:11px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase}.hero h1{font:700 clamp(38px,6vw,70px)/.95 "Syne",sans-serif;letter-spacing:-.08em;margin:10px 0 11px}.hero-intro{color:var(--muted);max-width:650px;margin:0}.hero-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.pill{display:inline-flex;border:1px solid var(--line);padding:5px 9px;color:var(--plum);font:11px "DM Mono",monospace}.layout{display:grid;grid-template-columns:1fr 300px;gap:19px;padding:39px 0 75px}.card{background:var(--white);border:1px solid var(--line);padding:23px}.card h2{font:700 25px "Syne",sans-serif;letter-spacing:-.06em;margin:0 0 18px}.course{border-top:1px solid var(--line);padding:19px 0;display:flex;justify-content:space-between;gap:18px}.course:first-child{padding-top:0;border-top:0}.course h3{font:700 20px "Syne",sans-serif;letter-spacing:-.04em;margin:0 0 6px}.course p{color:var(--muted);font-size:13px;margin:0 0 11px}.course .pill{margin-right:5px}.course-side{text-align:right;min-width:130px}.fee{font:500 12px "DM Mono",monospace;color:var(--plum);display:block;margin-bottom:10px}.apply{display:inline-block;background:var(--plum);color:var(--white);padding:10px 12px;font-size:12px;font-weight:800}.apply:hover{background:var(--orange);color:var(--plum-dark)}.contact-list{display:grid;gap:17px;color:var(--muted);font-size:13px}.contact-list strong{display:block;color:var(--plum);font:10px "DM Mono",monospace;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}.contact-list a{color:var(--plum);font-weight:700}.aside-note{background:var(--plum);color:var(--white);padding:20px;margin-top:16px}.aside-note strong{font:700 21px "Syne",sans-serif;letter-spacing:-.05em;display:block}.aside-note p{font-size:12px;color:#e8c9b7;margin:9px 0 0}.empty{color:var(--muted);padding:22px;background:var(--paper);font-size:13px}.error{padding:29px;background:#f5d9d0;border:1px solid #c77e6a;color:#702e2b}.loading{color:var(--muted);padding:40px 0;font:12px "DM Mono",monospace}.footer{border-top:1px solid var(--line);padding:20px 0 29px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px}.footer strong{color:var(--plum)}@media(max-width:760px){.shell{width:min(100% - 30px,600px)}.identity{grid-template-columns:75px 1fr;gap:15px}.logo{width:75px;height:75px;font-size:28px}.layout{grid-template-columns:1fr;padding-top:26px}.course{display:block}.course-side{text-align:left;margin-top:13px}.footer{display:block}.footer span{display:block;margin-top:8px}}
    .course-group+.course-group{border-top:1px solid var(--line);margin-top:26px;padding-top:22px}.course-group>.eyebrow{margin-bottom:2px}.course-group .course:first-of-type{border-top:0;padding-top:10px}
  </style>
</head>
<body>
  <div class="topline"><div class="shell">Provider profile / APSHULE Skills</div></div>
  <header><div class="shell nav"><a class="brand" href="./"><span class="mark">A</span><span>APSHULE <small style="display:block;font:10px 'DM Mono',monospace;color:var(--muted);letter-spacing:.02em">Skills / Uganda</small></span></a><a class="back" href="./">← Back to course desk</a></div></header>
  <main class="shell"><section id="providerHero" class="hero"><div class="loading">Loading institution profile</div></section><div id="providerLayout" class="layout" style="display:none"></div><footer class="footer"><strong>Powered by APSHULE</strong></footer></main>
  <script>
     const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));try{firebase.initializeApp(window.APSHULE_FIREBASE_CONFIG)}catch(_){}
      const params=new URLSearchParams(location.search),requestedId=params.get("id")||"",ref=params.get("ref")||"",apiBase=window.APSHULE_API_BASE,apiUrl=path=>`${apiBase}/${path.replace(/^\/+/,"")}`,money=value=>Number(value||0)?`UGX ${Number(value).toLocaleString()}`:"Fee on inquiry";
    const logo=p=>p.logoUrl?`<img class="logo" src="${esc(p.logoUrl)}" alt="${esc(p.name)} logo">`:`<div class="logo">${esc((p.name||"P").slice(0,1).toUpperCase())}</div>`;
     fetch(apiUrl("/api/skills/providers")).then(response=>response.json().then(data=>{if(!response.ok||!data.ok)throw new Error(data.error||"Provider directory unavailable");return data})).then(data=>{
       const rows=data.providers||[];
      const provider=rows.find(row=>requestedId&&row.id===requestedId)||rows.find(row=>ref&&row.referralCode===ref);
      if(!provider){document.getElementById("providerHero").innerHTML='<div class="error"><strong>This institution is not available.</strong><br>It may be awaiting approval or the profile link may be incomplete. Return to the course desk to choose another provider.</div>';return}
      const courses=Array.isArray(provider.courses)?provider.courses.filter(course=>course.title):[];
      const grouped=courses.reduce((groups,course)=>{const key=course.category||"Courses";(groups[key]??=[]).push(course);return groups},{});
      document.title=`${provider.name} | APSHULE Skills`;
      document.getElementById("providerHero").innerHTML=`<div class="identity">${logo(provider)}<div><div class="eyebrow">Active training provider</div><h1>${esc(provider.name)}</h1><p class="hero-intro">${esc(provider.description||"A practical vocational institution helping learners build skills for work.")}</p><div class="hero-meta"><span class="pill">${esc(provider.physicalAddress||"Uganda")}</span>${provider.rating?`<span class="pill">Rated ${Number(provider.rating).toFixed(1)} / 5</span>`:""}<span class="pill">${courses.length} published course${courses.length===1?"":"s"}</span></div></div></div>`;
      const courseGroups=Object.entries(grouped).map(([category,items])=>`<section class="course-group"><div class="eyebrow">${esc(category)}</div>${items.map(course=>`<article class="course"><div><h3>${esc(course.title)}</h3><p>${esc(course.description||"Practical vocational training with this institution.")}</p>${course.duration?`<span class="pill">${esc(course.duration)}</span>`:""}${course.featured?'<span class="pill">Featured</span>':""}</div><div class="course-side"><span class="fee">${money(course.feeUgx)}</span><a class="apply" href="./skills-enroll.html?provider=${encodeURIComponent(provider.id)}&ref=${encodeURIComponent(provider.referralCode||"")}&course=${encodeURIComponent(course.id||course.title)}">Apply for this course</a></div></article>`).join("")}</section>`).join("");
      document.getElementById("providerLayout").style.display="grid";
      document.getElementById("providerLayout").innerHTML=`<section class="card"><h2>Courses at ${esc(provider.name)}</h2>${courseGroups||'<div class="empty">This institution has not published courses yet. Contact the provider for its next intake.</div>'}</section><aside><div class="card"><h2>Institution details</h2><div class="contact-list"><div><strong>Physical address</strong>${esc(provider.physicalAddress||"Available on request")}</div>${provider.contactPhone?`<div><strong>Phone</strong><a href="tel:${esc(provider.contactPhone)}">${esc(provider.contactPhone)}</a></div>`:""}${provider.contactEmail?`<div><strong>Email</strong><a href="mailto:${esc(provider.contactEmail)}">${esc(provider.contactEmail)}</a></div>`:""}<div><strong>Provider reference</strong>${esc(provider.referralCode||"Assigned by APSHULE")}</div></div></div><div class="aside-note"><strong>Ready to make a start?</strong><p>Choose a course above. Your admission application will keep this provider referral with it.</p></div></aside>`;
    }).catch(error=>{document.getElementById("providerHero").innerHTML='<div class="error"><strong>We could not load this profile.</strong><br>Please refresh and try again.</div>';console.warn(error)});
  </script>
</body>
</html>
