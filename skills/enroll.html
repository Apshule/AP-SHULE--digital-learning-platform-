<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register for a course | APSHULE Skills</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./api-config.js"></script>
  <style>
    :root{--ink:#17112b;--muted:#6d6680;--purple:#4b2e9e;--cream:#fbf8f1;--line:#ebe5f4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}.shell{width:min(560px,calc(100% - 34px));margin:auto}header{background:#4b2e9e;color:#fff;padding:18px 0}.brand{font-weight:900}.brand small{display:block;font-size:11px;font-weight:500;opacity:.8}.card{margin:48px 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 12px 35px #301d6610}.eyebrow{color:var(--purple);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.card h1{font-size:32px;line-height:1.1;letter-spacing:-.04em;margin:8px 0}.muted{color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin:15px 0}.field label{font-size:12px;font-weight:800}.field input{width:100%;padding:12px;border:1px solid #dcd4eb;border-radius:10px;font:inherit}.button{border:0;border-radius:10px;background:var(--purple);color:#fff;padding:12px 16px;font:inherit;font-weight:900;cursor:pointer}.button.secondary{background:#f0eaff;color:var(--purple)}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{font-size:13px;color:var(--muted);margin-top:14px}.status.error{color:#9b2632}.status.success{color:#237440}.auth{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.hidden{display:none!important}a{color:var(--purple);font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <header><div class="shell"><a class="brand" href="./">APSHULE VOCATIONAL TRAINING CENTRE<small>Where Dreams Come true</small></a></div></header>
   <main class="shell"><section class="card"><div class="eyebrow">Course registration</div><h1 id="courseTitle">Register for a course</h1><p id="courseSummary" class="muted">Confirm your APSHULE account to send your registration to the training provider.</p><div id="authArea" class="auth"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button id="signInBtn" class="button" type="button">Sign in</button><button id="signUpBtn" class="button secondary" type="button">Create account</button><button id="forgotPasswordBtn" class="button secondary" type="button">Forgot password?</button></div><p class="muted">Already use APSHULE? Sign in. New learners can create a free account here.</p></div><div id="signedInArea" class="hidden"><p id="signedInAs" class="muted"></p><div class="actions"><button id="registerBtn" class="button" type="button">Submit registration</button><a class="button secondary" href="./">Choose another course</a></div></div><div id="status" class="status" role="status" aria-live="polite"></div></section></main>
  <script>
    try{firebase.initializeApp(window.APSHULE_FIREBASE_CONFIG)}catch(_){}
    const auth=firebase.auth(), db=firebase.firestore(), params=new URLSearchParams(location.search), providerId=params.get("provider")||"", referralCode=params.get("ref")||"", courseId=params.get("course")||"", apiBase=window.APSHULE_API_BASE;
    const status=document.getElementById("status"), setStatus=(message,type="")=>{status.textContent=message;status.className=`status ${type}`};
    const apiUrl=path=>`${apiBase}/${path.replace(/^\\//,"")}`;
    async function requestAuth(action){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||password.length<6){setStatus("Enter an email and a password with at least 6 characters.","error");return}try{setStatus(action==="signup"?"Creating your account…":"Signing you in…");if(action==="signup"){const result=await auth.createUserWithEmailAndPassword(email,password);await db.collection("users").doc(result.user.uid).set({email,name:email.split("@")[0],role:"individual",status:"active",createdAt:new Date().toISOString()},{merge:true})}else await auth.signInWithEmailAndPassword(email,password)}catch(error){setStatus(error.message||"Authentication failed. Please try again.","error")}}
    auth.onAuthStateChanged(user=>{document.getElementById("authArea").classList.toggle("hidden",!!user);document.getElementById("signedInArea").classList.toggle("hidden",!user);if(user)document.getElementById("signedInAs").textContent=`Signed in as ${user.email}. The provider referral ${referralCode} will be saved with your registration.`});
     document.getElementById("forgotPasswordBtn").onclick=async()=>{const email=document.getElementById("email").value.trim(),button=document.getElementById("forgotPasswordBtn");if(!email){setStatus("Enter your account email first.","error");return}button.disabled=true;try{setStatus("Sending password reset email…");await auth.sendPasswordResetEmail(email);setStatus("Password reset email sent. Check your inbox to choose a new password.","success")}catch(error){setStatus(error.message||"Could not send the password reset email.","error")}finally{button.disabled=false}};
     document.getElementById("signInBtn").onclick=()=>requestAuth("signin");document.getElementById("signUpBtn").onclick=()=>requestAuth("signup");
    document.getElementById("registerBtn").onclick=async()=>{const user=auth.currentUser;if(!user){setStatus("Sign in before submitting your registration.","error");return}try{setStatus("Saving your registration…");const token=await user.getIdToken();const response=await fetch(apiUrl("/api/skills/enrollments"),{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({providerId,referralCode,courseId})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||"Registration failed");document.getElementById("registerBtn").disabled=true;setStatus("Registration submitted. The training provider can now follow up with you.","success")}catch(error){setStatus(error.message||"Could not submit registration. Please try again.","error")}};
    if(!providerId||!referralCode||!courseId)setStatus("This course link is incomplete. Please return to the provider profile.","error");
  </script>
</body>
</html>
